name: Production smoke PR79
on:
  push:
    branches: [chatgpt/production-smoke-pr79]
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc72e914c9cb4d2903ee0548fab4c9311fd727ec
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify deployed technology index
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 15 https://sreborn.net/technology/ -o /tmp/technology.html && grep -q 'data-registry-version="0.8"' /tmp/technology.html; then
              break
            fi
            sleep 10
          done
          curl -fsS --max-time 20 https://sreborn.net/technology/ -o /tmp/technology.html
          grep -q 'data-registry-version="0.8"' /tmp/technology.html
      - run: npx playwright install --with-deps chromium
      - name: Live production browser smoke and downloads
        env:
          QA_BASE_URL: https://sreborn.net
        run: npm run qa:home-browser
