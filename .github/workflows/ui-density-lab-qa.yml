name: UI density lab QA (no deploy)

on:
  push:
    branches:
      - experiment/ui-density-ab-20261107
    paths:
      - 'src/pages/lab/ui-density/**'
      - '.github/workflows/ui-density-lab-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out the experiment branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile Astro site
        run: npm run build
      - name: Verify expected HTML output
        run: |
          test -s dist/lab/ui-density/index.html
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/lab/ui-density/index.html', 'utf8');
          for (const label of ['GitHub형', 'Wiki형', 'CRM 데이터 첫 분석', 'noindex,nofollow']) {
            if (!html.includes(label)) throw new Error('Missing expected UI: ' + label);
          }
          console.log('Build output contains A/B, content and noindex');
          NODE
      - name: Install Playwright for isolated browser checks
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local preview and inspect all 4 UI states
        run: |
          set -eu
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/ui-density-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4321/lab/ui-density/ -o /tmp/ui-density-page.html; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/ui-density-preview.log; exit 1; fi
          mkdir -p /tmp/ui-density-qa
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const sizes = [[1440,900],[768,1024],[390,844],[320,720]];
          const results = [];
          let failed = false;
          for (const [width,height] of sizes) {
            const page = await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            page.on('pageerror', error => { console.error('PAGE_ERROR',error); failed=true });
            await page.goto('http://127.0.0.1:4321/lab/ui-density/',{waitUntil:'networkidle'});
            if(width<=560){
              const navToggle=page.locator('[data-mobile-nav-toggle]');
              if(!(await navToggle.isVisible())) { failed=true;console.error('Mobile nav toggle missing',width) }
              else {
                await navToggle.click();
                if(await navToggle.getAttribute('aria-expanded')!=='true') {failed=true;console.error('Mobile nav failed to expand',width)}
                await navToggle.click();
                if(await navToggle.getAttribute('aria-expanded')!=='false') {failed=true;console.error('Mobile nav failed to collapse',width)}
              }
            }
            for(const mode of ['explorer','wiki']) {
              await page.getByRole('button',{name:mode==='explorer'?'A · GitHub형':'B · Wiki형'}).click();
              for(const density of ['dense','normal']) {
                await page.getByRole('button',{name:density==='dense'?'압축':'표준'}).click();
                const metric=await page.evaluate(()=>{
                  const e=document.querySelector('.entry');
                  return {
                    viewport:document.documentElement.clientWidth,
                    scrollWidth:document.documentElement.scrollWidth,
                    documentHeight:document.documentElement.scrollHeight,
                    rowHeight:e?.getBoundingClientRect().height,
                    visibleLinks:[...document.querySelectorAll('.entry-name')].filter(a=>{const b=a.getBoundingClientRect();return b.top>=0&&b.top<innerHeight}).length,
                    mode:document.body.dataset.mode,
                    density:document.body.dataset.density
                  };
                });
                const name=`${width}x${height}-${mode}-${density}`;
                await page.screenshot({path:`/tmp/ui-density-qa/${name}.png`,fullPage:true});
                const ok=metric.scrollWidth<=metric.viewport+1 && metric.mode===mode && metric.density===density && (width>560 || metric.visibleLinks>0);
                if(!ok){failed=true;console.error('FAIL',name,metric)}
                results.push({name,ok,...metric});
              }
            }
            await page.close();
          }
          fs.writeFileSync('/tmp/ui-density-qa/results.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          await browser.close();
          if(failed)process.exit(1);
          NODE
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-density-ab-qa
          path: /tmp/ui-density-qa/
          if-no-files-found: warn
          retention-days: 7
