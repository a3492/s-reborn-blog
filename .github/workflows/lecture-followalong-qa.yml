name: Nov 8 compact follow-along full QA - no production deploy
on:
  push:
    branches:
      - experiment/daemire-compact-followalong-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lecture-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Assert unchanged 13 original source assets
        run: |
          set -eu
          count=$(find dist/downloads/daemire-1108 -maxdepth 1 -type f | wc -l)
          test "$count" -eq 13
          test -z "$(find dist/downloads/daemire-1108 -type f -empty -print)"
          test -s dist/lecture-materials/2026-11-08/index.html
          test -s dist/lecture-materials/2026-11-08/archive/index.html
          test -s dist/tools/lectures/2026-11-08-daemire/index.html
          test -s dist/tutorials/crm-first-analysis/index.html
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Follow the teaching flow with real browser clicks
        run: |
          set -eu
          mkdir -p /tmp/lecture-flow-qa
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist >/tmp/lecture-flow-server.log 2>&1 &
          P=$!
          trap 'kill "$P" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4321/lecture-materials/2026-11-08/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const results=[];let fails=0;
          const dims=[[1440,900],[768,1024],[390,844],[320,720]];
          const base='http://127.0.0.1:4321';
          for(const [width,height] of dims){
            const context=await browser.newContext({viewport:{width,height},acceptDownloads:true,permissions:['clipboard-read','clipboard-write']});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const must=async (name,condition,extra={})=>{const ok=Boolean(condition);results.push({viewport:width+'x'+height,name,ok,...extra});if(!ok){fails++;console.error('FAIL',name,width,extra)}};
            const hrefs=['/lecture-materials/','/lecture-materials/kim-dowi/','/lecture-materials/2026-11-08/','/lecture-materials/2026-11-08/archive/','/tools/lectures/2026-11-08-daemire/'];
            for(const path of hrefs){
              const response=await page.goto(base+path,{waitUntil:'networkidle'});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              await must('route-'+path,response?.status()===200&&overflow<=1&&errors.length===0,{status:response?.status(),overflow,errors:errors.slice()});
            }
            await page.goto(base+'/lecture-materials/2026-11-08/',{waitUntil:'networkidle'});
            await page.getByRole('link',{name:'10:00 · 경영 도구 강연'}).click();
            await must('cost-navigation',await page.evaluate(()=>location.hash==='#cost'));
            const why=page.locator('#cost .steps details').first();
            await why.locator('summary').click();
            await must('why-visible',await why.getAttribute('open')!==null);
            const crmLink=page.locator('#crm .primary');
            const crmHref=await crmLink.getAttribute('href');
            await must('crm-link',crmHref==='/tutorials/crm-first-analysis/');
            await page.goto(base+'/lecture-materials/2026-11-08/archive/',{waitUntil:'networkidle'});
            await must('archive-files',await page.locator('.archive .group li a[download]').count()===13);
            await page.locator('.archive .group').first().locator('summary').click();
            const link=page.locator('.archive .group li a[download]').first();
            const [download]=await Promise.all([page.waitForEvent('download'),link.click()]);
            const payload=fs.readFileSync(await download.path());
            await must('real-download',payload.length>0&&download.suggestedFilename().endsWith('.md'),{bytes:payload.length});
            await page.goto(base+'/tools/lectures/2026-11-08-daemire/',{waitUntil:'networkidle'});
            const map=page.locator('details.archived-reference');
            await must('archive-collapsed',!(await map.evaluate(e=>e.open)));
            await map.locator('summary').click();
            await must('archive-expanded',await map.evaluate(e=>e.open));
            const crmOriginal=page.locator('.panel-crm .education-extra');
            await must('original-eleven-lessons',await crmOriginal.count()===11);
            await page.locator('label[for="tab-ops"]').click();
            await must('ops-tab',await page.locator('#tab-ops').isChecked()&&await page.locator('.panel-ops').isVisible());
            const opsButton=page.locator('.ops-step-nav [data-ops-jump="1"]');
            await opsButton.scrollIntoViewIfNeeded();
            const yBefore=await page.evaluate(()=>window.scrollY);
            await opsButton.click();
            const yAfter=await page.evaluate(()=>window.scrollY);
            await must('step-switch-no-jump',await page.locator('[data-ops-card="1"]').isVisible()&&Math.abs(yAfter-yBefore)<=3,{yBefore,yAfter});
            const copy=page.locator('[data-ops-card="1"] [data-copy]').first();
            await copy.click();
            const copyVal=await page.evaluate(()=>navigator.clipboard.readText());
            const expected=(await page.locator('#copy-'+await copy.getAttribute('data-copy')).textContent())?.trim();
            await must('copy-prompt',copyVal===expected&&expected.length>30);
            await page.screenshot({path:'/tmp/lecture-flow-qa/daemire-'+width+'.png',fullPage:true});
            await context.close();
          }
          fs.writeFileSync('/tmp/lecture-flow-qa/results.json',JSON.stringify(results,null,2));
          await browser.close();
          console.log(JSON.stringify({checks:results.length,passed:results.filter(r=>r.ok).length,failed:fails,failures:results.filter(r=>!r.ok)},null,2));
          if(fails)process.exit(1);
          NODE
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lecture-flow-qa-screenshots-and-results
          path: /tmp/lecture-flow-qa/
          retention-days: 7
          if-no-files-found: warn
