name: Homepage browser QA
on:
  push:
    branches: ['refactor/compact-content-hierarchy-20261119']
    paths:
      - 'src/pages/index.astro'
      - 'src/styles/brand-home.css'
      - 'scripts/qa-home-browser.mjs'
      - '.github/workflows/home-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser layout and interaction QA
        run: |
          mkdir -p qa-screenshots
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          node scripts/qa-home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
