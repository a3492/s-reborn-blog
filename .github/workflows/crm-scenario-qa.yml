name: CRM scenario quality gate
on:
  push:
    paths:
      - 'public/tutorials/crm-scenarios/**'
      - 'public/downloads/crm-scenarios/**'
      - 'scripts/validate-crm-scenarios.mjs'
      - '.github/workflows/crm-scenario-qa.yml'
  pull_request:
    paths:
      - 'public/tutorials/crm-scenarios/**'
      - 'public/downloads/crm-scenarios/**'
      - 'scripts/validate-crm-scenarios.mjs'
      - '.github/workflows/crm-scenario-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/validate-crm-scenarios.mjs
      - run: npm ci
      - run: npm run build
      - name: Check production assets
        run: |
          test -s dist/tutorials/crm-scenarios/index.html
          test "$(find dist/downloads/crm-scenarios -maxdepth 1 -name 'P??-??.txt' | wc -l)" -ge 30
